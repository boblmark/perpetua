<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViralLoop OA · 公司运营中枢</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--panel:#161b26;--border:#2a3348;--txt:#e6e9f0;--muted:#8b93a7;--accent:#4f8ef7;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--gray:#64748b}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;height:100vh;overflow:hidden}
/* 左侧导航 */
.sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:18px 16px;border-bottom:1px solid var(--border)}
.brand h1{font-size:17px}
.brand .sub{font-size:11px;color:var(--muted);margin-top:4px}
.nav{flex:1;overflow-y:auto;padding:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);margin-bottom:2px;transition:all .15s}
.nav-item:hover{background:#1e2637;color:var(--txt)}
.nav-item.active{background:#1e3a5f;color:#7dd3fc}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px}
.nav-sec{font-size:11px;color:var(--gray);padding:12px 12px 4px;text-transform:uppercase}
/* 右侧内容 */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--panel)}
.topbar h2{font-size:18px}
.topbar .clock{font-size:12px;color:var(--muted)}
.content{flex:1;overflow-y:auto;padding:24px}
.page{display:none}
.page.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* 卡片 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
.card h3{font-size:14px;margin-bottom:10px;color:#a8b3cc}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid #202838}
.kv:last-child{border:none}
.kv .v{color:#7dd3fc;font-weight:600}
/* 组织架构 */
.dept{margin-bottom:18px}
.dept-name{font-size:15px;font-weight:600;color:#c4b5fd;margin-bottom:8px}
.role-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#1a2233;border-radius:8px;margin-bottom:6px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.d-ok{background:var(--green)}.d-live{background:var(--green);box-shadow:0 0 6px var(--green)}.d-offline{background:var(--red)}.d-idle{background:var(--gray)}.d-restricted{background:var(--yellow)}
.role-note{margin-left:auto;font-size:11px;color:var(--gray)}
/* 审批 */
.appr{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.appr .tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:4px;margin-right:8px}
.tag-video{background:#7c3aed}.tag-ask{background:#0284c7}.tag-urgent{background:#dc2626}
.appr .title{font-size:15px;margin:8px 0}
.appr .meta{font-size:12px;color:var(--muted)}
.appr .actions{margin-top:12px;display:flex;gap:8px}
.btn{padding:8px 20px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.btn-ok{background:#16a34a;color:#fff}.btn-no{background:#374151;color:#fff}
.btn-ok:hover{background:#15803d}.btn-no:hover{background:#4b5563}
/* 管线 */
.stage{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.stage .num{width:28px;height:28px;border-radius:50%;background:#1e3a5f;color:#7dd3fc;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.stage .info{flex:1}
.stage .name{font-size:14px;font-weight:600}
.stage .desc{font-size:12px;color:var(--muted);margin-top:2px}
.empty{color:var(--gray);font-size:13px;padding:20px;text-align:center}
@media(max-width:768px){.sidebar{width:64px}.nav-item span.lbl,.brand .sub,.brand h1{display:none}.nav-item{justify-content:center}}
</style>
</head>
<body>
<!-- 左侧导航 -->
<div class="sidebar">
<div class="brand"><h1>🏢 ViralLoop</h1><div class="sub">AI 数据中心指挥</div></div>
<div class="nav">
<div class="nav-sec">运营</div>
<div class="nav-item active" data-p="dashboard"><span>📊</span><span class="lbl">运营总览</span></div>
<div class="nav-item" data-p="approvals"><span>✅</span><span class="lbl">待办审批</span><span class="badge" id="nav-badge">0</span></div>
<div class="nav-item" data-p="pipeline"><span>🔄</span><span class="lbl">工作流</span></div>
<div class="nav-sec">组织</div>
<div class="nav-item" data-p="org"><span>👥</span><span class="lbl">组织架构</span></div>
<div class="nav-item" data-p="depts"><span>📈</span><span class="lbl">部门 KPI</span></div>
<div class="nav-sec">系统</div>
<div class="nav-item" data-p="audit"><span>🛡️</span><span class="lbl">审计日志</span></div>
<div class="nav-item" data-p="marvis"><span>🤝</span><span class="lbl">Marvis 协作</span></div>
<div class="nav-item" data-p="videos"><span>🎬</span><span class="lbl">视频库</span></div>
<div class="nav-sec">内容</div>
<div class="nav-item" data-p="content"><span>🧰</span><span class="lbl">内容工具箱</span></div>
<div class="nav-sec">增长</div>
<div class="nav-item" data-p="leads"><span>💼</span><span class="lbl">销售管道</span></div>
<div class="nav-item" data-p="dist"><span>📡</span><span class="lbl">分发矩阵</span></div>
<div class="nav-item" data-p="revenue"><span>💰</span><span class="lbl">变现看板</span></div>
<div class="nav-sec">架构</div>
<div class="nav-item" data-p="blueprint"><span>🏗️</span><span class="lbl">架构蓝图</span></div>
</div>
</div>
<!-- 右侧 -->
<div class="main">
<div class="topbar"><h2 id="page-title">运营总览</h2>
<div style="display:flex;align-items:center;gap:12px">
<button onclick="speakPending()" style="background:#1e3a5f;border:1px solid #2a3550;color:#7dd3fc;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px">🔊 语音播报待办</button>
<input id="cmd-input" placeholder="输入指令，如：批准视频 / 查看待办" style="background:#0d1117;border:1px solid #2a3550;color:#e6e9f0;padding:8px 12px;border-radius:8px;font-size:13px;width:220px" onkeydown="if(event.key==='Enter')sendCmd()">
<button id="mic-btn" onclick="voiceCmd()" title="语音输入" style="background:#1e3a5f;border:1px solid #2a3550;color:#7dd3fc;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:15px">🎤</button>
<button onclick="sendCmd()" style="background:#16a34a;border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px">执行</button>
<div class="clock" id="clock"></div></div></div>
<div class="content">

<!-- 总览 -->
<div class="page active" id="p-dashboard">
<div class="cards" id="dash-cards"><div class="empty">加载中…</div></div>
<div class="cards" id="charts-row" style="margin-top:4px"></div>
</div>

<!-- 审批 -->
<div class="page" id="p-approvals"><div id="appr-list"><div class="empty">加载中…</div></div></div>

<!-- 工作流 -->
<div class="page" id="p-pipeline"><div class="cards" id="pipe-charts-row" style="margin-bottom:4px"></div><div id="pipeline-list"><div class="empty">加载中…</div></div></div>

<!-- 组织 -->
<div class="page" id="p-org"><div id="org-tree"><div class="empty">加载中…</div></div></div>

<!-- 部门KPI -->
<div class="page" id="p-depts"><div class="cards" id="dept-cards"><div class="empty">加载中…</div></div></div>

<!-- 审计 -->
<div class="page" id="p-audit"><div id="audit-list"><div class="empty">加载中…</div></div></div>

<!-- Marvis -->
<div class="page" id="p-marvis"><div id="marvis-panel"><div class="empty">加载中…</div></div></div>

<!-- 视频库 -->
<div class="page" id="p-videos"><div id="video-list"><div class="empty">加载中…</div></div></div>

<!-- 内容工具箱 -->
<div class="page" id="p-content">
<div id="ct-tools" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>
<div class="card"><h3 id="ct-title">选择工具</h3><div id="ct-form"></div></div>
<div class="card" style="margin-top:12px"><h3>结果</h3><div id="ct-result"><div class="empty">选择上方工具开始</div></div></div>
</div>

<!-- 销售管道 -->
<div class="page" id="p-leads">
<div class="card"><h3>➕ 新线索</h3>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<input id="ld-name" placeholder="客户/公司名" style="flex:1;min-width:120px;background:#0d1117;border:1px solid #2a3550;color:#e6e9f0;padding:8px;border-radius:8px">
<select id="ld-source" style="background:#0d1117;border:1px solid #2a3550;color:#e6e9f0;padding:8px;border-radius:8px"><option>猪八戒</option><option>Upwork</option><option>转介绍</option><option>自然流量</option><option>其他</option></select>
<input id="ld-demand" placeholder="需求简述" style="flex:2;min-width:160px;background:#0d1117;border:1px solid #2a3550;color:#e6e9f0;padding:8px;border-radius:8px">
<button onclick="leadAdd()" style="background:#16a34a;border:none;color:#fff;padding:8px 20px;border-radius:8px;cursor:pointer">添加</button>
</div><div class="meta" style="margin-top:6px">报价/对外消息发出前必须人类确认，本模块只记录流转不自动发送。</div></div>
<div id="leads-board" style="margin-top:12px"><div class="empty">加载中…</div></div>
</div>

<!-- 分发矩阵 -->
<div class="page" id="p-dist">
<div class="card"><h3>➕ 加入分发队列</h3>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<input id="dt-vid" placeholder="video_id" style="background:#0d1117;border:1px solid #2a3550;color:#e6e9f0;padding:8px;border-radius:8px">
<input id="dt-title" placeholder="标题" style="flex:1;min-width:160px;background:#0d1117;border:1px solid #2a3550;color:#e6e9f0;padding:8px;border-radius:8px">
<button onclick="distAdd()" style="background:#16a34a;border:none;color:#fff;padding:8px 20px;border-radius:8px;cursor:pointer">加入</button>
</div></div>
<div id="dist-list" style="margin-top:12px"><div class="empty">加载中…</div></div>
</div>

<!-- 变现看板 -->
<div class="page" id="p-revenue">
<div class="card"><h3>➕ 记一笔收入</h3>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<input id="rv-date" type="date" style="background:#0d1117;border:1px solid #2a3550;color:#e6e9f0;padding:8px;border-radius:8px">
<select id="rv-source" style="background:#0d1117;border:1px solid #2a3550;color:#e6e9f0;padding:8px;border-radius:8px"><option>猪八戒</option><option>Upwork</option><option>YouTube</option><option>赞助</option><option>联盟</option><option>其他</option></select>
<select id="rv-type" style="background:#0d1117;border:1px solid #2a3550;color:#e6e9f0;padding:8px;border-radius:8px"><option>服务</option><option>订阅</option><option>赞助</option><option>广告分成</option><option>联盟</option></select>
<input id="rv-amount" type="number" placeholder="金额" style="width:110px;background:#0d1117;border:1px solid #2a3550;color:#e6e9f0;padding:8px;border-radius:8px">
<input id="rv-note" placeholder="备注" style="flex:1;min-width:120px;background:#0d1117;border:1px solid #2a3550;color:#e6e9f0;padding:8px;border-radius:8px">
<button onclick="revenueAdd()" style="background:#16a34a;border:none;color:#fff;padding:8px 20px;border-radius:8px;cursor:pointer">记账</button>
</div></div>
<div id="revenue-board" style="margin-top:12px"><div class="empty">加载中…</div></div>
</div>

<!-- 架构蓝图 -->
<div class="page" id="p-blueprint"><div id="blueprint-body"><div class="empty">加载中…</div></div></div>

</div>
</div>

<script>
const TITLES={dashboard:'运营总览',approvals:'待办审批',pipeline:'工作流状态',org:'组织架构',depts:'部门 KPI',audit:'审计日志',marvis:'Marvis 协作',videos:'视频库',content:'内容工具箱',leads:'销售管道',dist:'分发矩阵',revenue:'变现看板',blueprint:'架构蓝图'};
const STAGE_NAMES={trend:'趋势输入',select:'选题生成',review:'Ask Studio 评审',generate:'视频生成',qc:'QC 质检',publish:'终审上传',postop:'发布后运营',evolve:'数据进化'};
const STAGE_DESC={trend:'雷达每天 + 热点每小时',select:'每天 3 档选题',review:'每 30 分钟 · ≥85 分放行',generate:'每 10 分钟 · 失败重试 2 次',qc:'每 20 分钟 · 10 项检查',publish:'Marvis 取货 / Dash 代传',postop:'6h 换标题 · 评论互动',evolve:'标准每天进化'};
let cache={};

document.querySelectorAll('.nav-item').forEach(el=>{
  el.onclick=()=>{
    document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('p-'+el.dataset.p).classList.add('active');
    document.getElementById('page-title').textContent=TITLES[el.dataset.p];
    render(el.dataset.p);
  };
});

const dot=s=>`<span class="dot d-${s}"></span>`;
const stName=s=>({live:'运行中',ok:'正常',offline:'离线',idle:'空闲',restricted:'受限',active:'在岗'}[s]||s);

async function fetchJSON(u){const r=await fetch(u);return r.json();}

async function loadAll(){
  document.getElementById('clock').textContent='实时更新 · '+new Date().toLocaleString('zh-CN');
  try{cache.org=await fetchJSON('/api/oa/org');}catch(e){}
  try{cache.appr=await fetchJSON('/api/oa/approvals');}catch(e){}
  try{cache.dept=await fetchJSON('/api/oa/departments');}catch(e){}
  try{cache.pipe=await fetchJSON('/api/pipeline?tenant_id=default');}catch(e){}
  const n=(cache.appr&&cache.appr.count)||0;
  const b=document.getElementById('nav-badge');
  b.textContent=n; b.style.display=n?'':'none';
  render(document.querySelector('.nav-item.active').dataset.p);
}

function render(p){
  if(p==='dashboard')renderDash();
  else if(p==='approvals')renderAppr();
  else if(p==='pipeline')renderPipe();
  else if(p==='org')renderOrg();
  else if(p==='depts')renderDepts();
  else if(p==='audit')renderAudit();
  else if(p==='marvis')renderMarvis();
  else if(p==='videos')renderVideos();
  else if(p==='content')renderContent();
  else if(p==='leads')renderLeads();
  else if(p==='dist')renderDist();
  else if(p==='revenue')renderRevenue();
  else if(p==='blueprint')renderBlueprint();
}

function renderDash(){
  const pipe=cache.pipe||{};
  const stages=pipe.stages||[];
  const live=stages.filter(s=>s.freshness==='live').length;
  const appr=(cache.appr&&cache.appr.count)||0;
  const subs=(cache.snap&&cache.snap.subs)||'—';
  document.getElementById('dash-cards').innerHTML=`
    <div class="card"><h3>管线健康</h3>
      <div class="kv"><span>整体状态</span><span class="v">${pipe.overall==='live'?'🟢 正常':'🔴 异常'}</span></div>
      <div class="kv"><span>运行中阶段</span><span class="v">${live} / 8</span></div></div>
    <div class="card"><h3>待办事项</h3>
      <div class="kv"><span>待审批</span><span class="v">${appr} 项</span></div>
      <div class="kv"><span>审批红线</span><span class="v">发布/删除/花钱</span></div></div>
    <div class="card"><h3>频道</h3>
      <div class="kv"><span>@karenvsai</span><span class="v">532 订阅</span></div>
      <div class="kv"><span>YPP 目标</span><span class="v">90天 300万播放</span></div></div>
    <div class="card"><h3>快捷入口</h3>
      <div class="kv"><span>Perpetua Dashboard</span><span class="v"><a href="/" style="color:#7dd3fc">→ 前往</a></span></div>
      <div class="kv"><span>公司章程</span><span class="v">CHARTER.md</span></div></div>`;
  renderCharts();
}
async function renderCharts(){
  const els=[document.getElementById('charts-row'),document.getElementById('pipe-charts-row')].filter(Boolean);
  if(!els.length)return;
  try{
    const d=await fetchJSON('/api/oa/charts');
    let html='';
    if(d.daily_output&&d.daily_output.length){
      const max=Math.max.apply(null,d.daily_output.map(x=>x.count).concat([1]));
      html+='<div class="card"><h3>📊 近14天日产量</h3><div style="display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:8px">'+d.daily_output.map(x=>'<div title="'+x.day+': '+x.count+'" style="flex:1;background:#3b82f6;border-radius:3px 3px 0 0;height:'+(Math.round(x.count/max*70)+4)+'px"></div>').join('')+'</div><div class="meta" style="margin-top:4px">'+d.daily_output[0].day+' ~ '+d.daily_output[d.daily_output.length-1].day+'</div><div class="meta" style="margin-top:6px;color:#94a3b8">每天通过选题评审进入生成的视频数。悬停柱子查看具体日期和数量。</div></div>';
    }
    html+='<div class="card"><h3>✅ QC 通过率</h3><div style="font-size:28px;font-weight:700;color:#4ade80;margin:8px 0">'+(d.qc_rate||0)+'%</div><div class="meta">共 '+(d.qc_total||0)+' 次检查</div><div class="meta" style="margin-top:6px;color:#94a3b8">视频生成后自动质检（10项检查）的通过比例。通过率低说明生成质量有问题，需调整提示词。</div></div>';
    if(d.views_trend&&d.views_trend.length){
      const max=Math.max.apply(null,d.views_trend.map(x=>x.views).concat([1]));
      html+='<div class="card"><h3>👁 近14天播放趋势</h3><div style="display:flex;align-items:flex-end;gap:3px;height:80px;margin-top:8px">'+d.views_trend.map(x=>'<div title="'+x.day+'：'+x.views+' 播放" style="flex:1;background:#8b5cf6;border-radius:3px 3px 0 0;height:'+(Math.round(x.views/max*70)+4)+'px"></div>').join('')+'</div><div class="meta" style="margin-top:6px;color:#94a3b8">每天新发布视频获得的播放量。柱子越高说明当天视频越受欢迎。</div></div>';
    }
    els.forEach(el=>el.innerHTML=html);
  }catch(e){els.forEach(el=>el.innerHTML='');}
}

function renderAppr(){
  const a=cache.appr||{approvals:[],count:0};
  const tagFor=t=>t==='video'?'<span class="tag tag-video">视频终审</span>':t==='retitle'?'<span class="tag tag-urgent">改标题</span>':'<span class="tag tag-ask">Ask 评审</span>';
  document.getElementById('appr-list').innerHTML=a.count?a.approvals.map(x=>`
    <div class="appr">
      ${tagFor(x.type)}
      <div class="title">${x.title||'(无标题)'}</div>
      ${x.type==='retitle'?`<div class="meta" style="margin:6px 0">📹 ${x.video_id||''}<br>📝 ${x.reason||''}</div>`:''}
      <div class="meta">创建时间：${x.created||'—'}</div>
      ${(x.type==='video'||x.type==='retitle')?`<div class="actions">
        <button class="btn btn-ok" onclick="decide('${(x.title||'').replace(/'/g,'')}',true)">批准</button>
        <button class="btn btn-no" onclick="decide('${(x.title||'').replace(/'/g,'')}',false)">驳回</button>
      </div>`:`<div class="meta" style="margin-top:8px">⏳ 等待 Ask Studio 回答</div>`}
    </div>`).join(''):'<div class="empty">暂无待审批事项 🎉</div>';
}

function renderPipe(){
  const stages=(cache.pipe&&cache.pipe.stages)||[];
  const order=['trend','select','review','generate','qc','publish','postop','evolve'];
  const map={};stages.forEach(s=>map[s.id||s.stage]=s);
  document.getElementById('pipeline-list').innerHTML=order.map((id,i)=>{
    const s=map[id]||{};
    const f=s.freshness||'offline';
    const col=f==='live'?'#4ade80':f==='stale'?'#fbbf24':'#f87171';
    const txt=f==='live'?'运行中':f==='stale'?'延迟':'离线';

];
let ctCur='brief';
function renderContent(){
  document.getElementById('ct-tools').innerHTML=CT_TOOLS.map(t=>
    `<button onclick="ctSelect('${t.id}')" style="background:${ctCur===t.id?'#1e3a5f':'#141b2d'};border:1px solid #2a3550;color:${ctCur===t.id?'#7dd3fc':'#e6e9f0'};padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px">${t.icon} ${t.name}</button>`).join('');

  }else{

      `<div style="margin-bottom:8px"><div class="meta">${i[1]}</div>
       ${i[0]==='topics'?`<textarea id="ct-in-${i[0]}" rows="4" placeholder="${i[2]}" style="width:100%;background:#0d1117;border:1px solid #2a3550;color:#e6e9f0;padding:8px;border-radius:8px"></textarea>`
       :`<input id="ct-in-${i[0]}" placeholder="${i[2]}" style="width:100%;background:#0d1117;border:1px solid #2a3550;color:#e6e9f0;padding:8px;border-radius:8px">`}</div>`).join('')+
      `<button onclick="ctRun()" style="background:#16a34a;border:none;color:#fff;padding:8px 20px;border-radius:8px;cursor:pointer">执行</button>`;
  }

function ctSelect(id){ctCur=id;renderContent();}
async function ctRun(){
  const t=CT_TOOLS.find(x=>x.id===ctCur);
  const el=document.getElementById('ct-result');
  el.innerHTML='<div class="empty">执行中…</div>';
  const payload={tool:t.id};
  t.inputs.forEach(i=>{
    const v=(document.getElementById('ct-in-'+i[0])||{}).value||'';
    if(i[0]==='topics'){payload.topics=v.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|');return{title:p[0].trim(),score:parseFloat(p[1])||0};});}
    else payload[i[0]]=v;
  });
  try{
    const r=await fetch(t.id==='brief'?'/api/oa/content/brief':'/api/oa/content',{method:t.id==='brief'?'GET':'POST',headers:{'Content-Type':'application/json'},body:t.id==='brief'?undefined:JSON.stringify(payload)});
    const d=await r.json();
    el.innerHTML=ctRender(t.id,d);
  }catch(e){el.innerHTML='<div class="empty">执行失败：'+e.message+'</div>';}
}
function ctRender(id,d){
  if(d.error)return '<div class="empty">错误：'+d.error+'</div>';
  const kv=(k,v)=>`<div class="kv"><span>${k}</span><span class="v">${v}</span></div>`;
  const li=a=>'<ul style="margin:6px 0;padding-left:20px">'+a.map(x=>'<li style="margin:3px 0">'+x+'</li>').join('')+'</ul>';
  if(id==='brief')return `<div class="kv"><span>品牌</span><span class="v">${d.brand}</span></div>
    <div class="meta" style="margin:8px 0"><b>Voice：</b>${d.voice}</div>
    <div class="meta" style="margin:8px 0"><b>受众：</b>${d.audience}</div>
    <div class="meta" style="margin:8px 0"><b>标题公式：</b>${d.title_formula}</div>
    <b>关键发现（真实数据）：</b>${li(d.key_findings||[])}
    <b>硬规则：</b>${li(d.hard_rules||[])}
    <div class="meta">${d.gate}</div>`;
  if(id==='guide')return `<div class="kv"><span>话题</span><span class="v">${d.topic}</span></div>
    <div class="kv"><span>适配度</span><span class="v">${d.fit_score}</span></div>
    ${(d.checks||[]).map(c=>`<div class="kv"><span>${c.ok?'✅':'❌'} ${c.item}</span><span class="v" style="font-weight:normal">${c.note}</span></div>`).join('')}
    <b>推荐角度：</b>${li(d.recommended_angles||[])}<b>避开：</b>${li(d.avoid||[])}
    <div class="meta">${d.dedup_reminder}</div>`;
  if(id==='copy')return `<b>标题候选：</b>`+(d.titles||[]).map(t=>`<div class="appr"><div class="title">${t.title}</div><div class="meta">评分 ${t.score} · ${t.pass?'✅ 达标':'❌ 未达线'}</div></div>`).join('')+
    `<b>描述：</b><div class="meta" style="white-space:pre-wrap;margin:6px 0">${d.description}</div>
     <b>置顶评论：</b><div class="meta" style="margin:6px 0">${d.pinned_comment}</div>
     <div class="meta">${d.purity_note}</div>`;
  if(id==='hooks')return `<b>10 个钩子（${d.topic||''}）：</b>`+(d.hooks||[]).map(h=>`<div class="appr"><div class="title">#${h.rank} [${h.type}] ${h.hook}</div><div class="meta">动词 ${h.verb}（${h.verb_tier} 级）</div></div>`).join('')+`<div class="meta">${d.note}</div>`;
  if(id==='score'){const c=d.pass?'#4ade80':'#f87171';return `<div style="font-size:32px;font-weight:700;color:${c}">${d.score} <span style="font-size:14px">/ ${d.threshold} 线 · ${d.grade}</span></div>
    <div class="title" style="margin:8px 0">${d.title}</div>
    ${(d.breakdown||[]).map(b=>kv(b.item+' ('+b.delta+')',b.note)).join('')}
    <div class="meta" style="margin-top:8px"><b>建议：</b>${d.suggestion}</div><div class="meta">${d.note}</div>`;}
  if(id==='schedule'){let lastDay='';return `<b>排期规则：</b>${li(d.rules||[])}<b>7 天排期：</b>`+(d.plan||[]).map(p=>{
    const dh=p.day!==lastDay?`<div class="meta" style="margin:10px 0 4px;font-weight:700">${p.day}${p.boost?' · '+p.boost:''}</div>`:'';
    lastDay=p.day;return dh+`<div class="kv"><span>${p.slot} · ${p.title}</span><span class="v">${p.score??''} ${p.slot_note}</span></div>`;}).join('');}
  if(id==='repurpose')return (d.items||[]).map(it=>`<div class="card" style="margin-bottom:8px"><div class="meta">原片：${it.original||''}${it.views?' · '+it.views+' 播放':''}</div>`+
    (it.angles||[]).map(a=>`<div class="appr"><div class="title">[${a.angle}] ${a.title}</div><div class="meta">钩子：${a.hook}</div></div>`).join('')+
    `<div class="meta">${it.dedup_reminder}</div></div>`).join('');
  return '<pre>'+JSON.stringify(d,null,2)+'</pre>';
}

async function decide(title, ok){
  if(!confirm((ok?'批准':'驳回')+'「'+title.slice(0,30)+'」？'))return;
  try{
    const r=await fetch(ok?'/api/oa/approve':'/api/oa/reject',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title})});
    const d=await r.json();
    if(d.ok){alert((ok?'已批准':'已驳回'));loadAll();}
    else alert('失败：'+(d.error||'未知'));
  }catch(e){alert('请求失败');}
}
async function sendCmd(){
  const cmd=document.getElementById('cmd-input').value.trim();
  if(!cmd)return;
  const title=document.getElementById('page-title');
  const orig=title.textContent;
  title.textContent='执行中…';
  try{
    // 简单指令解析
    if(/批准/.test(cmd)){
      const a=cache.appr||{approvals:[]};
      const v=a.approvals.find(x=>x.type==='video');
      if(!v){alert('没有待批准的视频');}
      else{
        const r=await fetch('/api/oa/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:v.title})});
        const d=await r.json();
        alert(d.ok?'已批准：'+v.title.slice(0,30):'失败：'+d.error);
        loadAll();
      }
    }else if(/驳回/.test(cmd)){
      const a=cache.appr||{approvals:[]};
      const v=a.approvals.find(x=>x.type==='video');
      if(!v){alert('没有待驳回的视频');}
      else{
        const r=await fetch('/api/oa/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:v.title})});
        const d=await r.json();
        alert(d.ok?'已驳回':'失败：'+d.error);
        loadAll();
      }
    }else if(/待办|审批/.test(cmd)){
      document.querySelector('[data-p="approvals"]').click();
    }else if(/工作流|管线/.test(cmd)){
      document.querySelector('[data-p="pipeline"]').click();
    }else if(/组织/.test(cmd)){
      document.querySelector('[data-p="org"]').click();
    }else{
      alert('指令：批准视频 / 驳回视频 / 查看待办 / 工作流状态 / 组织架构');
    }
  }catch(e){alert('执行失败');}
  title.textContent=orig;
  document.getElementById('cmd-input').value='';
}
function voiceCmd(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('当前浏览器不支持语音输入，请用 Chrome');return;}
  const btn=document.getElementById('mic-btn');
  const rec=new SR();
  rec.lang='zh-CN';rec.interimResults=false;rec.maxAlternatives=1;
  btn.style.background='#dc2626';btn.textContent='⏺';
  rec.onresult=e=>{
    const text=e.results[0][0].transcript;
    document.getElementById('cmd-input').value=text;
    btn.style.background='#1e3a5f';btn.textContent='🎤';
    sendCmd();
  };
  rec.onerror=e=>{
    btn.style.background='#1e3a5f';btn.textContent='🎤';
    if(e.error==='not-allowed'){
      alert('语音输入需要 HTTPS 或麦克风权限。\n当前是 HTTP，Chrome 不允许。\n请用文字输入，或联系管理员配置 HTTPS。');
    }else if(e.error!=='aborted'){
      alert('语音识别失败: '+e.error);
    }
  };
  rec.onend=()=>{btn.style.background='#1e3a5f';btn.textContent='🎤';};
  try{rec.start();}catch(e){alert('麦克风启动失败');}
}
function speakPending(){
  const btn=event&&event.target?event.target:null;
  const origBtn=btn?btn.textContent:'';
  function restore(){if(btn)btn.textContent=origBtn;}
  try{
    if(!('speechSynthesis' in window)){alert('当前浏览器不支持语音播报，请用 Chrome / Edge');return;}
    const a=cache.appr||{approvals:[],count:0};
    let text;
    if(!a.count){text='ViralLoop 提醒：目前没有待办事项，一切正常。';}
    else{
      const vs=a.approvals.filter(x=>x.type==='video').map(x=>x.title.slice(0,20)).join('、');
      const qs=a.approvals.filter(x=>x.type!=='video').length;
      text=`ViralLoop 提醒：有 ${a.count} 项待办。`;
      if(vs)text+=`视频终审：${vs}。`;
      if(qs)text+=`${qs} 个 Ask Studio 问题等待回答。`;
      text+='请及时处理。';
    }
    if(btn)btn.textContent='🔊 播报中…';
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';u.rate=1.0;u.volume=1;
    function pickVoice(){
      const voices=speechSynthesis.getVoices();
      const zh=voices.find(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith('zh'));
      if(zh){u.voice=zh;}
    }
    pickVoice();
    u.onend=restore;u.onerror=e=>{restore();console.warn('TTS error',e.error);};
    // 兜底：2秒后强制恢复按钮
    setTimeout(restore,8000);
    if(!speechSynthesis.getVoices().length){
      // 等 voices 加载
      let done=false;
      speechSynthesis.onvoiceschanged=()=>{if(done)return;done=true;pickVoice();speechSynthesis.cancel();speechSynthesis.speak(u);};
      setTimeout(()=>{if(done)return;done=true;speechSynthesis.cancel();speechSynthesis.speak(u);},1200);
    }else{
      speechSynthesis.speak(u);
    }
  }catch(e){restore();alert('语音播报出错: '+e.message);}
}
