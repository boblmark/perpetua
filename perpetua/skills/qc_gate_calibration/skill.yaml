  rationale: 'WHAT: QC gates were blocking good output while the evidence contradicted them. The REAL4 sample failed hookmotion 1.4 < 3.0 on a far-shot opening even though 7 of the competitor top10 use far-shot openings, and v1 misses were motion 1.94 < 2.5 and loop 0.59 < 0.75. WHY: the renderer/motion four-brain council (D20261016-002, user-approved) produced a distinct reusable method, not just a one-off fix: (1) falsify thresholds with first-party retention data (Ask Studio data falsified the 3.0 motion threshold: far-shot openings held 61 to 73 percent stayed vs 45 percent for high-motion openings), (2) write exemptions as machine-checkable alternative gates with fail-closed fallbacks instead of fuzzy waivers (red-team KILL stood: any slow opening will be retroactively relabeled an establishing wide shot to dodge the check, so a waiver eats the rule; the adopted spec uses measurable entry conditions, an alternative check at 1.5 to 3.0s, 7 fail-closed conditions, and a 180-day log validation), (3) expire competitor format sources after 30 days (red-team WEAKEN: by the time a format is templatized, replicated, and through QC, the viral format has rotated). No existing skill teaches this; skill_search found no overlap.'
