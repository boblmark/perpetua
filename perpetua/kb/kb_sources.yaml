# KB 知识源注册表（2026-10-09 三脑评审 C 方案 Commit 1）
# 每个源：key / path / adapter / task_types / device_scope / refresh
# adapter 类型：json_file / deep_dive_md / brain_review_dir / notebooklm_export

- key: dynamic_constraints
  path: /home/hatch/data/perpetua/dynamic_constraints.json
  adapter: json_file
  task_types: [prompt_gen, qc, topic_gen]
  device_scope: null
  refresh: cron
  priority: 1
  extract:
    entries_from: directives
    entry_id_template: "dynamic_constraints:{index}"

- key: criteria
  path: /home/hatch/data/jev/criteria.json
  adapter: json_file
  task_types: [prompt_gen, review, topic_gen]
  device_scope: null
  refresh: cron
  priority: 2
  extract:
    entries_from: rules
    entry_id_template: "criteria:{index}"

- key: publish_cadence
  path: /home/hatch/data/perpetua/kb/publish_cadence.json
  adapter: json_file
  task_types: [publish, review]
  device_scope: null
  refresh: manual
  priority: 3
  extract:
    entries_from: cadence
    entry_id_template: "publish_cadence:{index}"

- key: deep_dive_findings
  path: /home/hatch/data/perpetua/kb/deep_dive_findings.json
  adapter: json_file
  task_types: [prompt_gen, qc, topic_gen, review]
  device_scope: null
  refresh: cron
  priority: 4
  extract:
    entries_from: findings
    entry_id_template: "deep_dive:{device}:{index}"

- key: brain_review_index
  path: /home/hatch/data/perpetua/kb/brain_review_index.json
